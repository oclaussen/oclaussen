---
name: Metrics

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *" # Daily

jobs:
  header:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          base: header
          filename: header.svg

          output_action: gist
          committer_gist: 76f00f3fcf6f980320f2f7312a64d0db
          token: ${{ secrets.METRICS_TOKEN }}

          user: oclaussen
          template: classic
          config_timezone: Europe/Berlin

  repositories:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          base: repositories
          filename: repositories.svg

          output_action: gist
          committer_gist: 76f00f3fcf6f980320f2f7312a64d0db
          token: ${{ secrets.METRICS_TOKEN }}

          user: oclaussen
          template: classic
          config_timezone: Europe/Berlin
          plugin_lines: yes

  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          base: activity, community
          filename: activity.svg

          output_action: gist
          committer_gist: 76f00f3fcf6f980320f2f7312a64d0db
          token: ${{ secrets.METRICS_TOKEN }}

          user: oclaussen
          template: classic
          config_timezone: Europe/Berlin

  habits:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          base: ""
          filename: habits.svg

          output_action: gist
          committer_gist: 76f00f3fcf6f980320f2f7312a64d0db
          token: ${{ secrets.METRICS_TOKEN }}

          user: oclaussen
          template: classic
          config_timezone: Europe/Berlin
          plugin_habits: yes
          plugin_habits_from: 1000
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes

  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          base: ""
          filename: calender.svg

          output_action: gist
          committer_gist: 76f00f3fcf6f980320f2f7312a64d0db
          token: ${{ secrets.METRICS_TOKEN }}

          user: oclaussen
          template: classic
          config_timezone: Europe/Berlin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

  achievements:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          base: achievements
          filename: achievements.svg

          output_action: gist
          committer_gist: 76f00f3fcf6f980320f2f7312a64d0db
          token: ${{ secrets.METRICS_TOKEN }}

          user: oclaussen
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0

  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          base: ""
          filename: languages.svg

          output_action: gist
          committer_gist: 76f00f3fcf6f980320f2f7312a64d0db
          token: ${{ secrets.METRICS_TOKEN }}

          user: oclaussen
          template: classic
          config_timezone: Europe/Berlin
          plugin_followup: yes
          plugin_languages: yes

  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          base: ""
          filename: topics.svg

          output_action: gist
          committer_gist: 76f00f3fcf6f980320f2f7312a64d0db
          token: ${{ secrets.METRICS_TOKEN }}

          user: oclaussen
          template: classic
          plugin_topics: yes
          plugin_topics_mode: icons
